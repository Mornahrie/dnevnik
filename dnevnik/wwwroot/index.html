<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Электронный дневник</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">

    <div class="login-box">
        <div class="login-logo">Д</div>
        <h2>Электронный дневник</h2>
        <div class="subtitle">Войдите в свою учётную запись</div>

        <input type="text" id="login" placeholder="Логин" autocomplete="username">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
        <button id="loginBtn">Войти</button>
        <div id="error-message" class="error-msg"></div>
    </div>

    <script>
        const btn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('error-message');

        function pick(obj, ...keys) {
            if (!obj) return undefined;
            for (const k of keys) {
                if (obj[k] !== undefined && obj[k] !== null) return obj[k];
            }
            return undefined;
        }

        function cleanToken(raw) {
            if (!raw) return '';
            return String(raw)
                .replace(/^\uFEFF/, '')
                .replace(/[\u200B-\u200D]/g, '')
                .replace(/\s/g, '')
                .trim();
        }

        async function login() {
            const loginInput = document.getElementById('login').value.trim();
            const passwordInput = document.getElementById('password').value;

            errorDiv.textContent = '';

            if (!loginInput || !passwordInput) {
                errorDiv.textContent = 'Пожалуйста, заполните все поля';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Вход...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: loginInput, password: passwordInput })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    errorDiv.textContent = err.message || 'Неверный логин или пароль';
                    return;
                }

                const data = await response.json();
                console.log('RAW RESPONSE:', data);

                const rawToken = pick(data, 'token', 'Token');
                const name = pick(data, 'name', 'Name') || '';
                const role = pick(data, 'role', 'Role') || '';
                const url = pick(data, 'redirectUrl', 'RedirectUrl');

                const token = cleanToken(rawToken);

                if (!token || !url) {
                    errorDiv.textContent = 'Сервер вернул неполный ответ';
                    console.error('Incomplete response:', data);
                    return;
                }

                console.log('TOKEN len =', token.length,
                    'first char code =', token.charCodeAt(0),
                    'last char code =', token.charCodeAt(token.length - 1),
                    'header =', token.split('.')[0]);

                try {
                    localStorage.setItem('token', token);
                    localStorage.setItem('userName', name);
                    localStorage.setItem('userRole', role);
                } catch (err) {
                    console.error('localStorage недоступен:', err);
                    errorDiv.textContent = 'Браузер блокирует сохранение сессии';
                    return;
                }

                if (localStorage.getItem('token') !== token) {
                    errorDiv.textContent = 'Не удалось сохранить сессию';
                    return;
                }

                window.location.replace(url);
            } catch (error) {
                console.error(error);
                errorDiv.textContent = 'Ошибка соединения с сервером';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        }

        btn.addEventListener('click', login);

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('login').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
    </script>
</body>
</html>
