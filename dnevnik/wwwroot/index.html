<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Электронный дневник</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 360px;
            text-align: center;
        }

            .login-box h2 {
                margin-bottom: 30px;
                color: #4a90e2;
                font-size: 24px;
            }

            .login-box input {
                width: 100%;
                padding: 14px;
                margin-bottom: 15px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                outline: none;
                transition: border 0.2s;
            }

                .login-box input:focus {
                    border-color: #4a90e2;
                }

            .login-box button {
                width: 100%;
                padding: 14px;
                background: #4a90e2;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.3s;
            }

                .login-box button:hover {
                    background: #357abd;
                }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Дневник учащегося</h2>
        <input type="text" id="login" placeholder="Логин" required autocomplete="username">
        <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password">
        <button onclick="login()">Войти</button>
        <div id="error-message" class="error-msg"></div>
    </div>

    <script>
        async function login() {
            const loginInput = document.getElementById('login').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error-message');

            errorDiv.textContent = '';

            if (!loginInput || !passwordInput) {
                errorDiv.textContent = 'Пожалуйста, заполните все поля';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ login: loginInput, password: passwordInput })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('userRole', data.role);

                    window.location.href = data.redirectUrl;
                } else {
                    const errorData = await response.json();
                    errorDiv.textContent = errorData.message || 'Неверный логин или пароль';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                errorDiv.textContent = 'Ошибка соединения с сервером. Проверьте, запущен ли сервер.';
            }
        }

        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });
    </script>

</body>
</html>
